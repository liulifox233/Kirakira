[package]
name = "krkr-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# GINKA and many KRKR titles ship Ogg Opus BGM/voice.  Keep Opus optional for
# wasm/headless consumers, but enable the native decoder in the desktop shell.
krkr-audio = { workspace = true, features = ["opus"] }
krkr-assets.workspace = true
krkr-core.workspace = true
krkr-plugins.workspace = true
krkr-render = { workspace = true, features = ["winit-surface"] }
krkr-engine.workspace = true
krkr-video.workspace = true
pollster.workspace = true
rfd.workspace = true
winit.workspace = true

[dev-dependencies]
krkr-tjs2.workspace = true
krkr-xp3.workspace = true

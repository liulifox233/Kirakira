[package]
name = "krkr-debug"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
krkr-assets.workspace = true
# PARQUET and many KRKR titles ship Ogg Opus BGM/voice.  Keep Opus optional for
# wasm/headless consumers, but build the harness with the native decoder too, so
# a standalone `krkr-debug` carries the same codec support as `krkr-desktop`.
krkr-audio = { workspace = true, features = ["opus"] }
krkr-core.workspace = true
krkr-engine.workspace = true
krkr-plugins.workspace = true
krkr-tjs2.workspace = true
krkr-video.workspace = true

[package]
name = "krkr-video"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSURL", "NSDictionary", "NSValue", "NSString", "NSError"] }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true, features = ["objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", optional = true }
objc2-core-audio-types = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3", optional = true, features = ["objc2-core-media"] }

[features]
default = []
macos-avfoundation = [
    "objc2",
    "objc2-foundation",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
    "objc2-core-audio-types",
    "objc2-av-foundation",
]

[package]
name = "krkr-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
krkr-core.workspace = true
krkr-font.workspace = true
krkr-kag.workspace = true
krkr-tjs2.workspace = true
krkr-video.workspace = true
libtlg-rs.workspace = true

# The VideoOverlay native object decodes through the host platform's media
# framework (krkr2/krkrz use DirectShow / Media Foundation); on macOS that is
# AVFoundation. Other platforms get an "unsupported" backend until their
# decoders are implemented.
[target.'cfg(target_os = "macos")'.dependencies]
krkr-video = { workspace = true, features = ["macos-avfoundation"] }

[dev-dependencies]
krkr-assets.workspace = true

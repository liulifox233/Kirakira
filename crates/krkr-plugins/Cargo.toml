[package]
name = "krkr-plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
krkr-engine.workspace = true
krkr-tjs2.workspace = true
# The E-mote motion adapter (`Motion`, RL/palette texture decode, software
# draw-list rasteriser) that `motion_player.rs` exposes as the plugin surface.
krkr-emote.workspace = true
# The `lzfs` media decodes LZ4 frames with `lz4_flex`'s frame API (the same
# crate `krkr-emote` already pulls into the workspace).
lz4_flex = "0.11"
# `sqlite3.dll` talks to the SQLite C API directly: the reference plugin wraps
# the bundled amalgamation and keeps prepared statements alive across script
# calls, which needs the raw `sqlite3_stmt` lifecycle. `bundled` compiles the
# official amalgamation (3.x, the reference's version line) with the host C
# compiler, exactly like the reference's `sqlite3.c`.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
# `httprequest.dll` needs an HTTP(S) client. `ureq` is blocking and
# pure-Rust (rustls) with no async runtime, matching this engine's dependency
# style; the reference is equally synchronous inside its worker thread.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# `httprequest.dll`'s request/response text conversion and its Basic
# authorization header need an IANA-name charset lookup and base64.
encoding_rs.workspace = true
base64.workspace = true
# The `expat` port drives XML with `quick-xml`; the reference links the expat
# C library instead, and this workspace takes no C dependencies. Already in
# the lockfile as a transitive dependency.
quick-xml = "0.39"
# The `psd` port inflates ZIP-compressed layer channels with `flate2`
# (miniz_oxide backend); the reference compiles zlib in under `USE_ZLIB`
# (`psdimage.cpp:5-8`). Already in the lockfile as a transitive dependency.
flate2 = "1.1"

[dev-dependencies]
krkr-assets.workspace = true
krkr-audio.workspace = true
krkr-core.workspace = true
